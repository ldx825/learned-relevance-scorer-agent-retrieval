job_name: ${SKILLBENCH_PAPER_BASELINE_JOB_NAME}
jobs_dir: ${SKILLBENCH_PAPER_BASELINE_JOBS_DIR}
n_attempts: 1
timeout_multiplier: 1.0
debug: false

orchestrator:
  type: local
  n_concurrent_trials: ${SKILLBENCH_PAPER_BASELINE_WORKERS}
  quiet: false
  retry:
    # Retry infrastructure failures only.  The longer per-task Docker build
    # timeout prevents a retry from starting while the original build is still
    # downloading a large toolchain.
    max_retries: 3
    include_exceptions: null
    exclude_exceptions:
      - VerifierTimeoutError
      - BadRequestError
      - RateLimitError
      - AgentTimeoutError
    wait_multiplier: 1.0
    min_wait_sec: 1.0
    max_wait_sec: 60.0
  kwargs: {}

environment:
  type: docker
  import_path: null
  force_build: false
  # Stop containers after each trial but retain successfully built images so a
  # retry or later paper-aligned run can reuse the expensive dependencies.
  delete: false
  override_cpus: null
  override_memory_mb: null
  override_storage_mb: null
  override_gpus: null
  kwargs:
    keep_containers: false

verifier:
  override_timeout_sec: null
  max_timeout_sec: null
  disable: false

metrics: []

agents:
  - name: terminus-2
    import_path: null
    model_name: openai/MiniMax-M2.7
    override_timeout_sec: null
    override_setup_timeout_sec: 1800
    max_timeout_sec: null
    kwargs:
      api_base: https://yunwu.ai/v1
      record_terminal_session: false

datasets:
  - task_names: null
    path: ${SKILLBENCH_PAPER_BASELINE_TASKS_DIR}
