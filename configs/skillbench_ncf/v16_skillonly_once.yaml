job_name: ${SKILLBENCH_V16_NCF_JOB_NAME}
jobs_dir: ${SKILLBENCH_V16_NCF_JOBS_DIR}
n_attempts: 1
timeout_multiplier: 1.0
debug: false

orchestrator:
  type: local
  n_concurrent_trials: ${SKILLBENCH_V16_NCF_WORKERS}
  quiet: false
  retry:
    max_retries: 3
    include_exceptions: null
    exclude_exceptions:
      - VerifierTimeoutError
      - BadRequestError
      - RateLimitError
      - AgentTimeoutError
    wait_multiplier: 1.0
    min_wait_sec: 1.0
    max_wait_sec: 60.0
  kwargs: {}

environment:
  type: docker
  import_path: null
  force_build: false
  delete: true
  override_cpus: null
  override_memory_mb: null
  override_storage_mb: null
  override_gpus: null
  kwargs:
    keep_containers: false

verifier:
  override_timeout_sec: null
  max_timeout_sec: null
  disable: false

metrics: []

agents:
  - name: terminus-2
    import_path: null
    model_name: ${SKILLBENCH_V16_NCF_AGENT_MODEL}
    override_timeout_sec: null
    override_setup_timeout_sec: 1800
    max_timeout_sec: null
    kwargs:
      api_base: https://yunwu.ai/v1
      record_terminal_session: false
      reasoning_effort: ${SKILLBENCH_V16_NCF_REASONING_EFFORT}

datasets:
  - task_names: null
    path: ${SKILLBENCH_V16_NCF_TASKS_DIR}
