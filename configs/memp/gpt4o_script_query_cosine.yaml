  online_update: false

evaluation:
  environment: AlfredTWEnv
  controller: oracle
  few_shot: true
  max_steps: 30
  random_seed: 42
  dev_split: eval_in_distribution
  dev_games: 140
  test_split: eval_out_of_distribution
  test_games: 134
  first_stage_limit: 10
